name: Build-SUSFS-Kernel-TB321FU

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev libelf-dev zip unzip python3 git curl wget clang lld llvm cpio rsync

      - name: prepare-and-config
        run: |
          {
          set -x
          cd $GITHUB_WORKSPACE
          mkdir -p src && cd src
          curl -L --retry 3 -A "Mozilla/5.0" -o lenovo.tar.gz "https://download.lenovo.com/consumer/mobiles/legion_tab_y700(tb321fu)_opensource_16.1.02.082.tar.gz"
          tar -xzf lenovo.tar.gz ./kernel-6.1.68.tar.gz
          mkdir -p k && tar -xzf kernel-6.1.68.tar.gz -C k ./kernel
          mv k/kernel kernel_tree
          cd kernel_tree
          cp ../../device.config .config
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
          cd $GITHUB_WORKSPACE/src
          git clone --depth 1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android14-6.1 susfs4ksu
          cd kernel_tree
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch ./ || true
          cp ../susfs4ksu/kernel_patches/fs/* ./fs/ || true
          cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/ || true
          patch -p1 < 50_add_susfs_in_gki-android14-6.1.patch
          echo "PATCH_EXIT=$?"
          printf '%s\n' 'CONFIG_KSU=y' 'CONFIG_KSU_SUSFS=y' 'CONFIG_KSU_SUSFS_SUS_PATH=y' 'CONFIG_KSU_SUSFS_SUS_MOUNT=y' 'CONFIG_KSU_SUSFS_SUS_KSTAT=y' 'CONFIG_KSU_SUSFS_SPOOF_UNAME=y' 'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y' 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' 'CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y' 'CONFIG_KSU_SUSFS_SUS_SU=n' 'CONFIG_KSU_SUSFS_ENABLE_LOG=n' 'CONFIG_LOCALVERSION="-android14-11"' 'CONFIG_WERROR=n' >> .config
          echo "config lines before make: $(wc -l < .config)"
          mkdir -p out && cp .config out/.config
          echo "=== A. make O=out olddefconfig ==="
          make ARCH=arm64 LLVM=1 O=out olddefconfig
          echo "OLDDEFCONFIG_EXIT=$?"
          echo "=== B. out 目录内容 ==="
          ls -la out/ | head -20
          echo "=== C. KSU 开关核对 ==="
          grep -E "CONFIG_KSU|CONFIG_LOCALVERSION" out/.config | head -20
          grep -c "CONFIG_KSU=y" out/.config
          echo "=== D. 如果没有 out/.config, 试试 tree 内直接 olddefconfig ==="
          if [ ! -f out/.config ]; then make ARCH=arm64 LLVM=1 olddefconfig; echo "FALLBACK_EXIT=$?"; grep -E "CONFIG_KSU=y|CONFIG_LOCALVERSION" .config | head; fi
          } > $GITHUB_WORKSPACE/diag1.txt 2>&1
          tail -70 $GITHUB_WORKSPACE/diag1.txt

      - name: build
        run: |
          {
          set -x
          cd $GITHUB_WORKSPACE/src/kernel_tree
          if [ ! -f out/.config ]; then mkdir -p out && cp .config out/.config; fi
          make -j$(nproc) ARCH=arm64 LLVM=1 O=out KCFLAGS="-Wno-error" HOSTCFLAGS="-Wno-error" Image
          echo "BUILD_EXIT=$?"
          } > $GITHUB_WORKSPACE/diag2-full.txt 2>&1
          tail -250 $GITHUB_WORKSPACE/diag2-full.txt > $GITHUB_WORKSPACE/diag2.txt
          cat $GITHUB_WORKSPACE/diag2.txt
          ls -la out/arch/arm64/boot/Image || true

      - name: publish-diag
        if: always()
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name diag
          git config user.email diag@example.com
          git add -f diag1.txt diag2.txt
          git commit -m "diag" || echo "nothing to commit"
          git push || echo "push failed"

      - name: upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image-susfs
          path: src/kernel_tree/out/arch/arm64/boot/Image
          if-no-files-found: error
