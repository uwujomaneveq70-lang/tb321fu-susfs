name: Build-SUSFS-Kernel-TB321FU

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev libelf-dev zip unzip python3 git curl wget clang lld llvm cpio rsync patch

      - name: run-all
        continue-on-error: true
        run: |
          cat > /tmp/all.sh <<'SCRIPT'
          set +e
          W=$GITHUB_WORKSPACE
          mkdir -p $W/src && cd $W/src
          echo "=== PHASE1 download ==="
          if [ ! -s lenovo.tar.gz ]; then
            curl -L --retry 8 --retry-delay 10 --retry-all-errors -A "Mozilla/5.0" -o lenovo.tar.gz "https://download.lenovo.com/consumer/mobiles/legion_tab_y700(tb321fu)_opensource_16.1.02.082.tar.gz"
          fi
          echo "SIZE=$(stat -c%s lenovo.tar.gz)"
          echo "=== PHASE2 extract ==="
          rm -rf kernel_tree k
          tar -xzf lenovo.tar.gz ./kernel-6.1.68.tar.gz
          mkdir -p k && tar -xzf kernel-6.1.68.tar.gz -C k ./kernel
          mv k/kernel kernel_tree
          echo "TREE=$(ls kernel_tree/Makefile)"
          echo "=== PHASE3 KernelSU ==="
          cd kernel_tree
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
          echo "KSU_DIR=$(ls -d KernelSU 2>/dev/null)"
          echo "=== PHASE4 SUSFS(只打 50_ 主补丁) ==="
          cd $W/src
          rm -rf susfs4ksu
          git clone --depth 1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android14-6.1 susfs4ksu
          cd kernel_tree
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch ./
          cp -r ../susfs4ksu/kernel_patches/fs/. ./fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/. ./include/linux/
          patch -p1 --fuzz=3 < 50_add_susfs_in_gki-android14-6.1.patch
          echo "PATCH50_EXIT=$?"
          echo "=== PHASE5 config(放进 out/) ==="
          rm -f .config
          mkdir -p out && cp $W/device.config out/.config
          make ARCH=arm64 LLVM=1 O=out olddefconfig
          E=$?
          echo "OLD1_EXIT=$E"
          if [ $E -ne 0 ]; then
            echo "--- retry after mrproper ---"
            make ARCH=arm64 mrproper
            mkdir -p out && cp $W/device.config out/.config
            make ARCH=arm64 LLVM=1 O=out olddefconfig
            echo "OLD1B_EXIT=$?"
          fi
          printf '%s\n' 'CONFIG_KSU=y' 'CONFIG_KSU_SUSFS=y' 'CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y' 'CONFIG_KSU_SUSFS_SUS_PATH=y' 'CONFIG_KSU_SUSFS_SUS_MOUNT=y' 'CONFIG_KSU_SUSFS_SUS_KSTAT=y' 'CONFIG_KSU_SUSFS_SPOOF_UNAME=y' 'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y' 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' 'CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y' 'CONFIG_KSU_SUSFS_SUS_SU=n' 'CONFIG_KSU_SUSFS_ENABLE_LOG=n' 'CONFIG_LOCALVERSION="-android14-11"' 'CONFIG_WERROR=n' >> out/.config
          make ARCH=arm64 LLVM=1 O=out olddefconfig
          echo "OLD2_EXIT=$?"
          echo "--- KSU/SUSFS 是否生效 ---"
          grep -E "^CONFIG_KSU=|^CONFIG_KSU_SUSFS=|^CONFIG_LOCALVERSION" out/.config
          echo "KSU_SUSFS_LINES=$(grep -c 'CONFIG_KSU_SUSFS' out/.config)"
          echo "CONFIG_LINES_TOTAL=$(wc -l < out/.config)"
          echo "=== PHASE6 build ==="
          make -j$(nproc) ARCH=arm64 LLVM=1 O=out KCFLAGS="-Wno-error" HOSTCFLAGS="-Wno-error" Image
          echo "BUILD_EXIT=$?"
          ls -la out/arch/arm64/boot/Image 2>&1
          echo "SUSFS_SYMBOLS=$(strings out/arch/arm64/boot/Image 2>/dev/null | grep -ci susfs)"
          SCRIPT
          bash /tmp/all.sh > $GITHUB_WORKSPACE/diag.txt 2>&1
          tail -80 $GITHUB_WORKSPACE/diag.txt || true

      - name: publish-diag
        if: always()
        continue-on-error: true
        run: |
          cd $GITHUB_WORKSPACE
          head -2500 diag.txt > diag_small.txt 2>/dev/null || true
          echo "..... [中间省略] ....." >> diag_small.txt
          tail -2500 diag.txt >> diag_small.txt 2>/dev/null || true
          git config user.name diag
          git config user.email diag@example.com
          git add -f diag_small.txt || true
          git commit -m "diag" || true
          git push || true

      - name: upload-image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image-susfs
          path: src/kernel_tree/out/arch/arm64/boot/Image
          if-no-files-found: warn
